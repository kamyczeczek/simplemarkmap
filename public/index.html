            }
            if (e.key === "Tab") {
                e.preventDefault();
                if (e.shiftKey) unindent(n);
                else addNode(n, true);
            } else if (e.key === "Enter") {
                e.preventDefault();
                addNode(n, false);
            } else if (e.key === "Delete" || e.key === "Backspace") {
                if (div.classList.contains("selected") && !div.querySelector(".title").isContentEditable) {
                    e.preventDefault();
                    e.stopPropagation(); // <-- ZASTRZEŻ: zapobiega podwójnemu usuwaniu przez globalny handler
                    if (e.key === "Backspace") {
                        // Backspace: enter edit mode and remove the node's LAST character,
                        // instead of deleting the whole node.
                        startEdit(div);
                        const t = div.querySelector(".title");
                        if (t) {
                            t.textContent = (n.title || "").slice(0, -1);
                            placeCaretAtEnd(t);
                        }
                    } else {
                        // Delete keeps deleting the entire node.
                        deleteSelectedNodes();
                    }
                }
            } else if (e.key === "ArrowRight" || e.key === "ArrowDown") {
                e.preventDefault();
                const next = e.key === "ArrowDown" ? nextSibling(n) : firstChild(n);
                if (next) { clearSelection();
                    selectNode(next); }
            } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
                e.preventDefault();
                const next = e.key === "ArrowUp" ? prevSibling(n) : parentOf(n);
                if (next) { clearSelection();
                    selectNode(next); }
            } else if (e.key === " " && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                if (state.selectedNodes.has(n)) {
                    state.selectedNodes.delete(n);
                    div.classList.remove("selected");
                } else {
                    state.selectedNodes.add(n);
                    div.classList.add("selected");
                }
                updateStatus();
            }
        }

        /* ---------------- Tree helpers ---------------- */
        function firstChild(n) { return n.children[0] || null; }

        function nextSibling(n) {
            const p = parentOf(n);
            if (!p) return null;
            const i = p.children.indexOf(n);
            return p.children[i + 1] || null;
        }

        function prevSibling(n) {
            const p = parentOf(n);
            if (!p) return null;
            const i = p.children.indexOf(n);
            return p.children[i - 1] || null;
        }

        function parentOf(n) { return findParent(root, n); }

        function findParent(node, target) {
            for (const c of node.children) {
                if (c === target) return node;
                const r = findParent(c, target);
                if (r) return r;
            }
            return null;
        }

        function findDiv(node, target) {
            for (const child of [...grid.children]) {
                if (child._node === target) return child;
            }
            return null;
        }

        function getAllNodes(node) {
            const result = [];
            const walk = (n) => {
                result.push(n);
                for (const c of n.children) walk(c);
            };
            walk(node || root);
            return result;
        }

        /* ---------------- Delete with neighbor navigation ---------------- */
        function findNeighbor(n) {
            const ns = nextSibling(n);
            if (ns) return ns;
            const ps = prevSibling(n);
            if (ps) return ps;
            const p = parentOf(n);
            return p === root ? null : p;
        }

        function deleteSelectedNodes() {
            const toDelete = [...state.selectedNodes];
            if (toDelete.length === 0) return;
            pushUndo();
            const neighbor = findNeighbor(toDelete[0]);
            for (const n of toDelete) {
                removeNode(n);
            }
            render();
            // After batch delete, clear selection or select a neighbor
            if (toDelete.length === 1 && neighbor) {
                selectNode(neighbor);
            } else if (toDelete.length === 1) {
                const all = getAllNodes(root);
                const nonRoot = all.filter(n => n !== root && n.title);
                if (nonRoot.length) selectNode(nonRoot[0]);
                else clearSelection();
            } else {
                // multiple deleted: clear selection, maybe select the neighbor of the first
                if (neighbor) selectNode(neighbor);
                else clearSelection();
            }
            updateStatus();
            scheduleAutoSave();
        }

        function removeNode(n) {
            const parent = findParent(root, n);
            if (!parent) return;
            const idx = parent.children.indexOf(n);
            if (idx !== -1) parent.children.splice(idx, 1);
        }

        function setSubtreeDepth(node, depth) {
            node.depth = depth;
            for (const child of node.children) {
                setSubtreeDepth(child, depth + 1);
            }
        }

        function unindent(n) {
            const gp = findParent(root, n);
            if (!gp) return;
            const ggp = findParent(root, gp);
            if (!ggp) return;
            pushUndo();
            const idx = gp.children.indexOf(n);
            gp.children.splice(idx, 1);
            const gidx = ggp.children.indexOf(gp);
            ggp.children.splice(gidx + 1, 0, n);
            setSubtreeDepth(n, gp.depth);
            render();
            selectNode(n);
            scheduleAutoSave();
        }

        function addNode(parent, asChild) {
            pushUndo();
            let newNode;
            if (asChild) {
                newNode = { title: "", body: [], children: [], depth: parent.depth + 1, source: "list" };
                parent.children.push(newNode);
            } else {
                const gp = findParent(root, parent);
                if (!gp) {
                    newNode = { title: "", body: [], children: [], depth: 1, source: "list" };
                    root.children.push(newNode);
                } else {
                    newNode = { title: "", body: [], children: [], depth: parent.depth, source: "list" };
                    const idx = gp.children.indexOf(parent);
                    gp.children.splice(idx + 1, 0, newNode);
                }
            }
            render();
            const ndiv = findDiv(root, newNode);
            if (ndiv) {
                clearSelection();
                state.selectedNodes.add(newNode);
                ndiv.classList.add("selected");
                ndiv.focus({ preventScroll: true });
                updateStatus();
            }
            scheduleAutoSave();
        }

        let saveTimer = null;

        function scheduleAutoSave() {
            if (!currentFile) return;
            if (saveTimer) clearTimeout(saveTimer);
            saveTimer = setTimeout(async () => {
                await saveQuietly();
            }, 400);
        }

        async function saveQuietly() {
            if (!currentFile) return;
            const text = serializeTree(root);
            try {
                await api("/api/write", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ file: currentFile, content: text }),
                });
                flash("autosaved ✓");
            } catch (e) { console.error("Autosave failed", e); }
        }

        function pushUndo() {
            state.undoStack.push(serializeTree(root).split("\n"));
            if (state.undoStack.length > 100) state.undoStack.shift();
            scheduleAutoSave();
        }

        function undo() {
            if (!state.undoStack.length) return;
            const text = state.undoStack.pop().join("\n");
            root = parseMarkdown(text);
            clearSelection();
            render();
            const all = getAllNodes(root);
            const nonRoot = all.filter(n => n !== root && n.title);
            if (nonRoot.length) selectNode(nonRoot[0]);
            updateStatus();
            scheduleAutoSave();
        }

        /* ---------------- Navigation History ---------------- */
        let historyStack = [];
        let historyIndex = -1;

        function pushHistory(file) {
            if (historyIndex < historyStack.length - 1) {
                historyStack = historyStack.slice(0, historyIndex + 1);
            }
            if (historyStack[historyStack.length - 1] !== file) {
                historyStack.push(file);
                historyIndex = historyStack.length - 1;
            }
            updateHistoryButtons();
        }

        function updateHistoryButtons() {
            const b = document.getElementById("backBtn");
            const f = document.getElementById("forwardBtn");
            if (b) b.disabled = (historyIndex <= 0);
            if (f) f.disabled = (historyIndex >= historyStack.length - 1);
        }

        document.getElementById("backBtn").onclick = () => {
            if (historyIndex > 0) {
                historyIndex--;
                openFile(historyStack[historyIndex], false);
            }
        };
        document.getElementById("forwardBtn").onclick = () => {
            if (historyIndex < historyStack.length - 1) {
                historyIndex++;
                openFile(historyStack[historyIndex], false);
            }
        };

        /* ---------------- Global Delete handler (batch delete) ---------------- */
        document.addEventListener("keydown", (e) => {
            if (e.key === "Delete" || e.key === "Backspace") {
                // If editing a node, let the node handler deal with it
                if (state.editing) return;
                // Never delete while typing in an editor; otherwise the global
                // handler must still handle selection made by box-select. The
                // browser may retain a node element as event.target after a drag.
                if (e.target.isContentEditable || (e.target.closest && e.target.closest("[contenteditable=\"true\"]"))) return;
                // If there are selected nodes, delete them all
                if (state.selectedNodes.size > 0) {
                    e.preventDefault();
                    deleteSelectedNodes();
                }
            }

            // Ctrl+Z undo
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
                e.preventDefault();
                undo();
            }

            // Ctrl+S save
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
                e.preventDefault();
                save();
            }

            // Ctrl+K — insert a relative .md link (only while editing a node)
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
                if (state.editing) {
                    e.preventDefault();
                    e.stopPropagation();
                    insertLinkToFile();
                }
            }

            // Escape closes the insert picker without committing the edit.
            if (e.key === "Escape" && state.pickerOpen) {
                e.preventDefault();
                e.stopPropagation();
                hidePicker();
            }
        });

        /* ---------------- Save / Open ---------------- */
        async function openFile(path, pushToHistory = true) {
            try {
                const data = await api("/api/read?file=" + encodeURIComponent(path));
                currentFile = data.path;
                localStorage.setItem("smm.lastFile", currentFile);
                root = parseMarkdown(data.content);
                state.undoStack = [];
                state.selectedNodes.clear();
                document.getElementById("crumbs").innerHTML = "<b>" + escapeHtml(currentFile) + "</b>";
                document.getElementById("saveBtn").disabled = false;
                hidePicker();
                render();
                const all = getAllNodes(root);
                const nonRoot = all.filter(n => n !== root && n.title);
                if (nonRoot.length) selectNode(nonRoot[0]);
                else clearSelection();
                updateStatus();
                if (pushToHistory) pushHistory(currentFile);
                updateHistoryButtons();
            } catch (e) {
                if (e.message && (e.message.includes("not found") || e.message.includes("404"))) {
                    // basenameOf handles both "/" and "\" via splitPath; falls
                    // back to a sane default if the path is empty.
                    const name = basenameOf(path).replace(/\.md$/i, "") || "new";
                    const defaultContent = "# " + name + "\n";
                    try {
                        await api("/api/write", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ file: path, content: defaultContent }),
                        });
                        const data = await api("/api/read?file=" + encodeURIComponent(path));
                        currentFile = data.path;
                        root = parseMarkdown(data.content);
                        state.undoStack = [];
                        state.selectedNodes.clear();
                        document.getElementById("crumbs").innerHTML = "<b>" + escapeHtml(currentFile) + "</b>";
                        document.getElementById("saveBtn").disabled = false;
                        hidePicker();
                        render();
                        const all = getAllNodes(root);
                        const nonRoot = all.filter(n => n !== root && n.title);
                        if (nonRoot.length) selectNode(nonRoot[0]);
                        else clearSelection();
                        updateStatus();
                        flash("created new file ✓");
                        if (pushToHistory) pushHistory(currentFile);
                        updateHistoryButtons();
                    } catch (err2) {
                        alert("Failed to create file: " + err2.message);
                    }
                } else {
                    alert("Open failed: " + e.message);
                }
            }
        }

        async function save() {
            if (!currentFile) return;
            const text = serializeTree(root);
            try {
                await api("/api/write", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ file: currentFile, content: text }),
                });
                flash("saved ✓");
            } catch (e) { alert("Save failed: " + e.message); }
        }

        document.getElementById("saveBtn").onclick = save;
        document.getElementById("addRootBtn").onclick = () => {
            if (!root) root = parseMarkdown("# New map\n");
            pushUndo();
            const n = { title: "", body: [], children: [], depth: 1, source: "list" };
            root.children.push(n);
            render();
            const ndiv = findDiv(root, n);
            if (ndiv) {
                clearSelection();
                state.selectedNodes.add(n);
                ndiv.classList.add("selected");
                ndiv.focus({ preventScroll: true });
                updateStatus();
            }
        };

        let flashTimer = null;

        function flash(msg) {
            const s = document.getElementById("status");
            s.textContent = msg;
            clearTimeout(flashTimer);
            flashTimer = setTimeout(() => (s.textContent = ""), 1500);
        }

        /* ---------------- Init ---------------- */
        initSelBox();

        window.addEventListener("load", () => {
            const params = new URLSearchParams(window.location.search);
            const initialFile = params.get("file");
            const lastFile = localStorage.getItem("smm.lastFile");
            if (initialFile) {
                openFile(initialFile);
            } else if (lastFile) {
                hidePicker();
                // Plain launch: resume the last opened file directly.
                openFile(lastFile, true).catch(() => {
                    window.electronAPI.openSystemDialog().then((rel) => {
                        if (rel) openFile(rel);
                    }).catch(() => {});
                });
            } else {
                hidePicker();
                // Everything goes through the native OS file picker.
                window.electronAPI.openSystemDialog().then((rel) => {
                    if (rel) openFile(rel);
                }).catch(() => {});
            }
        });
    </script>
</body>
</html>
